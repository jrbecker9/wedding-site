# Cloudflare Pages configuration.
# Local dev:  npx wrangler pages dev .
# The D1 binding below also needs to be added in the Pages dashboard
# (Settings → Functions → D1 database bindings → binding name "DB").
name = "cj-wedding"
compatibility_date = "2026-08-11"
pages_build_output_dir = "."

[[d1_databases]]
binding = "DB"
database_name = "cj-wedding-rsvps"
database_id = "f8f775c3-8344-4315-99f6-72fefac66d31"
